<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>PREVENT-U | Login</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Arial", sans-serif;
        background: linear-gradient(135deg, #ffc3ff, #ffffff);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card {
        background: #ffffff;
        width: 350px;
        padding: 30px;
        border-radius: 18px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        text-align: center;
        animation: fadein 0.8s ease;
    }

    @keyframes fadein {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h1 {
        color: #0a4c8b;
        margin-bottom: 10px;
    }

    p.subtitle {
        color: #667eea;
        margin-bottom: 25px;
        font-size: 15px;
    }

    input {
        width: 90%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
        transition: 0.2s;
    }

    input:focus {
        border-color: #667eea;
        box-shadow: 0 0 6px rgba(10, 76, 139, 0.3);
    }

    button {
        width: 95%;
        background: #667eea;
        border: none;
        padding: 12px;
        color: white;
        font-size: 16px;
        border-radius: 10px;
        margin-top: 15px;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #083d72;
    }

    .error {
        color: red;
        margin-top: 10px;
        font-size: 14px;
        display: none;
    }
</style>

</head>
<body>

<div class="card">
    <h1>Bienvenido a<br>PREVENT-U</h1>
    <p class="subtitle">Iniciá sesión para continuar</p>

    <input id="user" placeholder="Usuario">
    <input id="pass" type="password" placeholder="Contraseña">
    <button onclick="login()">Ingresar</button>

    <div id="error" class="error">Usuario o contraseña incorrectos</div>
</div>


<script>
async function login() {
    document.getElementById("error").style.display = "none";

    const data = new URLSearchParams();
    data.append("user", document.getElementById("user").value);
    data.append("pass", document.getElementById("pass").value);

    const res = await fetch("/login", {
        method: "POST",
        body: data
    });

    if (res.status === 200) {
        window.location.href = "/index.html";
    } else {
        document.getElementById("error").style.display = "block";
    }
}
</script>

</body>
</html>
